[project]
name = "ci-review-agent"
version = "0.1.0"
description = "Self-healing CI/CD agent using LangGraph"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2.0",
    "langchain-core>=1.4.0",
    "langchain-openai>=1.4.0",
    "langchain-anthropic>=1.5.0",
    "mcp>=1.27,<2",
    "gitpython>=3.1.0",
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
    "pydantic-settings>=2.0.0",
    "aiosqlite>=0.22.0",
    "asgiref>=3.12.0",
]

[project.scripts]
ci-agent = "main:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.backends._legacy:_Backend"
