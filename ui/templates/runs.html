{% extends "base.html" %}
{% block title %}Runs History — CI Review Agent{% endblock %}
{% block content %}
<style>
  html { scrollbar-width: none; -ms-overflow-style: none; }
  html::-webkit-scrollbar { display: none; width: 0; }
  #runs-container { scrollbar-width: none; -ms-overflow-style: none; }
  #runs-container::-webkit-scrollbar { display: none; width: 0; }
</style>
<div class="space-y-6 max-w-7xl mx-auto">
  
  <!-- Header & Filters -->
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
    <div>
      <h1 class="text-3xl font-bold tracking-tight">Run History</h1>
      <p class="text-sm text-slate-400 mt-1">Audit log of all CI webhook events processed by the agent.</p>
    </div>
    
    <div class="flex flex-wrap items-center gap-3">
      <!-- Search Input -->
      <div class="relative min-w-[220px]">
        <input type="text" id="run-search-input" onkeyup="filterRunsTable()" aria-label="Search runs" placeholder="Search repo or run ID..." class="input-field pl-9 text-xs">
        <svg class="w-4 h-4 text-slate-500 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      </div>

      <!-- Filter Form — both selects submit together so status + platform combine -->
      <form
        hx-get="/runs"
        hx-target="#runs-container"
        hx-swap="innerHTML"
        hx-indicator="#runs-filter-spinner"
        hx-trigger="change"
        class="flex flex-wrap items-center gap-3"
      >
        <!-- Status Filter -->
        <select id="filter-status" name="status" aria-label="Filter by status" class="select-field text-xs w-auto">
          <option value="">All Statuses</option>
          <option value="processing">Processing</option>
          <option value="agent_working">Agent Working</option>
          <option value="passed">Passed</option>
          <option value="failed">Failed</option>
          <option value="error">Error</option>
          <option value="exhausted">Exhausted</option>
        </select>

        <!-- Platform Filter -->
        <select id="filter-platform" name="platform" aria-label="Filter by platform" class="select-field text-xs w-auto">
          <option value="">All Platforms</option>
          <option value="github">GitHub</option>
          <option value="forgejo">Forgejo</option>
        </select>

        <!-- Filter Loading Spinner -->
        <span id="runs-filter-spinner" class="htmx-indicator" aria-hidden="true">
          <span class="spinner"></span>
        </span>
      </form>
    </div>
  </div>

  <!-- Runs Container -->
  <div id="runs-container" class="glass-panel max-h-[600px] overflow-y-auto scrollbar-none" aria-live="polite">
    {% include "partials/runs_table.html" %}
  </div>

</div>
{% endblock %}
